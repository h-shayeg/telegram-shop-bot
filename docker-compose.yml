services:
  db:
    image: postgres:16
    container_name: shopbot-db
    environment:
      POSTGRES_USER: shopbot
      POSTGRES_DB: shopbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopbot -d shopbot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
